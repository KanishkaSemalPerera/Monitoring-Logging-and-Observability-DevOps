global:
  resolve_timeout: 5m

# Routing tree: every alert enters at the top and walks down until it matches
route:
  receiver: lab-webhook                 # default receiver
  group_by: [alertname, route]          # one notification per (alertname, route)
  group_wait: 30s                       # wait to batch the first alerts of a group
  group_interval: 5m                    # wait before sending new alerts added to a group
  repeat_interval: 4h                   # re-send if still firing
  routes:
    - matchers:
        - severity="critical"
      receiver: lab-webhook
      group_wait: 10s
      continue: false

# If a critical alert fires for an instance, mute warnings for the same instance
inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: [instance]

receivers:
  # The sample-app logs every alert it receives -> see them in Grafana/Loki
  - name: lab-webhook
    webhook_configs:
      - url: http://sample-app:8000/webhook/alerts
        send_resolved: true

