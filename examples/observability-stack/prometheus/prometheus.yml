global:
  scrape_interval: 15s        # how often to scrape targets
  evaluation_interval: 15s    # how often to evaluate rules
  external_labels:
    env: lab

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Prometheus watching itself
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Linux host metrics (inside the Docker VM)
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Our instrumented app
  - job_name: sample-app
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ["sample-app:8000"]
        labels:
          service: sample-app
          team: payments

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  # Example: Kubernetes service discovery (not used in this lab)
  # - job_name: kubernetes-pods
  #   kubernetes_sd_configs:
  #     - role: pod
  #   relabel_configs:
  #     - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
  #       action: keep
  #       regex: "true"
