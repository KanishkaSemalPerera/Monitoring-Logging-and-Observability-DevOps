# ---------------------------------------------------------------
# Full observability lab: metrics + logs + traces on your laptop
#
#   docker compose up -d --build
#
#   sample-app     http://localhost:8000
#   Prometheus     http://localhost:9090
#   Alertmanager   http://localhost:9093
#   Grafana        http://localhost:3000   (admin / admin)
#   Jaeger UI      http://localhost:16686
#   Loki API       http://localhost:3100
#   Alloy UI       http://localhost:12345
# ---------------------------------------------------------------

services:
  # ---------- the app we are observing ----------
  sample-app:
    build: ./sample-app
    container_name: sample-app
    ports:
      - "8000:8000"
    environment:
      OTEL_SERVICE_NAME: sample-app
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    labels:
      logging: "alloy"          # Alloy only collects containers with this label
    depends_on:
      - otel-collector

  loadgen:
    image: curlimages/curl:8.10.1
    container_name: loadgen
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "loadgen: sending traffic to sample-app..."
        while true; do
          curl -s -o /dev/null http://sample-app:8000/
          curl -s -o /dev/null http://sample-app:8000/api/orders
          curl -s -o /dev/null http://sample-app:8000/api/orders
          curl -s -o /dev/null http://sample-app:8000/api/slow
          sleep 0.5
        done
    depends_on:
      - sample-app

  # ---------- METRICS ----------
  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle            # allows: curl -X POST localhost:9090/-/reload
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager:/etc/alertmanager:ro

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    ports:
      - "9100:9100"

  # ---------- LOGS ----------
  loki:
    image: grafana/loki:3.3.0
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.5.0
    container_name: alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    ports:
      - "12345:12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  # ---------- TRACES ----------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # UI

  # ---------- VISUALIZE ----------
  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - jaeger

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
