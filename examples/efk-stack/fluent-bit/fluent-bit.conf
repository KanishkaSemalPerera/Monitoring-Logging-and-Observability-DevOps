# Fluent Bit pipeline: INPUT -> PARSER -> FILTER -> OUTPUT
[SERVICE]
    Flush         2
    Log_Level     info
    Parsers_File  parsers.conf
    # metrics at :2020/api/v1/metrics/prometheus
    HTTP_Server   On
    HTTP_Port     2020

[INPUT]
    Name              tail
    Path              /logs/app.log
    Tag               app.shop
    Parser            json
    Read_from_Head    true
    Refresh_Interval  5
    # remembers file offsets across restarts
    DB                /tmp/flb_app.db

# Add static fields to every record
[FILTER]
    Name    modify
    Match   app.*
    Add     environment lab
    Add     shipper fluent-bit

# Drop noisy health checks before they cost storage
[FILTER]
    Name     grep
    Match    app.*
    Exclude  route ^/healthz$

[OUTPUT]
    Name                es
    Match               app.*
    Host                elasticsearch
    Port                9200
    Logstash_Format     On
    # index: fluentbit-app-YYYY.MM.DD
    Logstash_Prefix     fluentbit-app
    # required for Elasticsearch 8
    Suppress_Type_Name  On
    Replace_Dots        On
    Retry_Limit         5

# Also print to the container log so you can see it working:
#   docker logs -f fluent-bit
[OUTPUT]
    Name    stdout
    Match   app.*
    Format  json_lines
