# Logstash pipeline: INPUT -> FILTER -> OUTPUT
input {
  file {
    path => "/logs/access.log"
    start_position => "beginning"
    sincedb_path => "/tmp/sincedb-access"
  }
}

filter {
  # 1. Turn the raw nginx line into fields with a built-in grok pattern
  grok {
    match => { "message" => "%{COMBINEDAPACHELOG}" }
  }

  # 2. Use the time from the log line, not the time Logstash read it
  date {
    match => [ "timestamp", "dd/MMM/yyyy:HH:mm:ss Z" ]
    target => "@timestamp"
  }

  # 3. Make status a number so you can do status >= 500 in Kibana
  mutate {
    convert => { "[http][response][status_code]" => "integer" }
    add_field => { "environment" => "lab" "shipper" => "logstash" }
  }

  # 4. Tag server errors for easy filtering
  if [http][response][status_code] and [http][response][status_code] >= 500 {
    mutate { add_tag => [ "server_error" ] }
  }

  # 5. Enrich with location data (works for public IPs only)
  # geoip { source => "[source][address]" }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logstash-access-%{+YYYY.MM.dd}"
  }
  # stdout { codec => rubydebug }   # uncomment to debug parsing
}
