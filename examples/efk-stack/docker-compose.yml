# ---------------------------------------------------------------
# ELK + EFK logging lab
#
#   docker compose up -d
#
#   Elasticsearch  http://localhost:9200
#   Kibana         http://localhost:5601
#
# Two pipelines feed the same Elasticsearch:
#   app.log    (JSON)        -> Fluent Bit -> index "fluentbit-app-*"     (the "F" in EFK)
#   access.log (nginx style) -> Logstash   -> index "logstash-access-*"  (the "L" in ELK)
#
# Security is DISABLED to keep the lab simple. Never do this in production.
# Needs ~3 GB free RAM for Docker.
# ---------------------------------------------------------------

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 10s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  # Writes fake JSON app logs and nginx access logs into a shared volume
  log-generator:
    image: busybox:1.36
    container_name: log-generator
    command: ["sh", "/gen.sh"]
    volumes:
      - ./log-generator/gen.sh:/gen.sh:ro
      - app-logs:/logs

  fluent-bit:
    image: fluent/fluent-bit:3.1.9
    container_name: fluent-bit
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - app-logs:/logs:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    container_name: logstash
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
      XPACK_MONITORING_ENABLED: "false"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - app-logs:/logs:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  es-data:
  app-logs:
